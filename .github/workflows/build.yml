name: Build Multi-Platform Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pytmx pyinstaller
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name SproutValley --add-data "audio;audio" --add-data "data;data" --add-data "font;font" --add-data "graphics;graphics" code/main.py
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SproutValley-Windows
        path: dist/SproutValley.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pytmx pyinstaller
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name SproutValley --add-data "audio:audio" --add-data "data:data" --add-data "font:font" --add-data "graphics:graphics" code/main.py
    - name: Zip macOS App
      run: |
        cd dist
        zip -r SproutValley-Mac.zip SproutValley
    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SproutValley-Mac
        path: dist/SproutValley-Mac.zip
